name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version level (Minor or higher)
        id: check_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "🚀 Manual dispatch trigger: proceed with build."
            exit 0
          fi

          node scripts/check-version.mjs "${{ github.ref_name }}"
        env:
          GITHUB_OUTPUT: ${{ github.output }}

      - name: Install pnpm
        if: steps.check_version.outputs.should_build == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        if: steps.check_version.outputs.should_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.check_version.outputs.should_build == 'true'
        run: pnpm install --frozen-lockfile=false

      - name: Run automated tests
        if: steps.check_version.outputs.should_build == 'true'
        run: pnpm test

      - name: Build SMB Media Player package
        if: steps.check_version.outputs.should_build == 'true'
        run: pnpm run build

      - name: Create GitHub Release
        if: steps.check_version.outputs.should_build == 'true' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/smb-player-rocknix-*.zip
            dist/smb-player-rocknix.zip
          draft: false
          prerelease: false
          generate_release_notes: true
