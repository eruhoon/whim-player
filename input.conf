# ==========================================
# mpv input.conf for RG VITA PRO & Handhelds
# ==========================================

# Gamepad Controls (Native ROCKNIX / SDL / Wayland)
GAMEPAD_ACTION_DOWN cycle pause        # A button: Pause / Resume
GAMEPAD_ACTION_RIGHT quit              # B button: Back to SMB Player Menu
GAMEPAD_DPAD_RIGHT seek 10             # Right: Seek forward 10s
GAMEPAD_DPAD_LEFT seek -10             # Left: Seek backward 10s
GAMEPAD_DPAD_UP add volume 5           # Up: Volume up (boosts up to 200%)
GAMEPAD_DPAD_DOWN add volume -5        # Down: Volume down
GAMEPAD_RIGHT_SHOULDER playlist-next   # R1: Next episode / video
GAMEPAD_LEFT_SHOULDER playlist-prev    # L1: Prev episode / video
GAMEPAD_RIGHT_TRIGGER add speed 0.25   # R2: Speed up (1.25x, 1.5x...)
GAMEPAD_LEFT_TRIGGER add speed -0.25   # L2: Slow down
GAMEPAD_ACTION_LEFT cycle sub          # X button: Cycle subtitles
GAMEPAD_ACTION_UP cycle audio          # Y button: Cycle audio track
GAMEPAD_START cycle pause              # Start: Pause / Resume
GAMEPAD_BACK quit                      # Select: Back to menu

# Keyboard / gptokeyb Controls (Mapped to RG Vita Pro)
SPACE cycle pause
ENTER cycle pause
q quit
ESC quit
f quit
RIGHT seek 10
LEFT seek -10
UP add volume 5
DOWN add volume -5
x cycle sub
y cycle audio
v cycle sub
a cycle audio
s cycle sub-visibility

# Playback Speed Control (0.5x ~ 2.0x)
] add speed 0.25
[ add speed -0.25
\ set speed 1.0
= set speed 1.0

# Playlist Navigation (Next / Previous Video)
PGDWN playlist-next
PGUP playlist-prev
> playlist-next
< playlist-prev
. playlist-next
, playlist-prev
